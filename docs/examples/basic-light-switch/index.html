<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic light switch — Pardalote</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<main>
    <div id="top">
        <div class="brand"><a href="https://scottmit.github.io/Pardalote/examples/basic-light-switch.html">Pardalote</a></div>
        <div class="heading">Basic light switch</div>
        <div id="status">Upload the minimal-pardalote file to your Arduino, then connect below (WiFi IP or USB) and switch the board's built-in LED.</div>
    </div>

    <div class="buttons">
        <button id="led-on">Turn LED ON</button>
        <button id="led-off">Turn LED OFF</button>
    </div>

    <p class="hint">
        The simplest possible Pardalote page: two buttons calling
        digitalWrite() on the LED pin over WiFi or USB.
    </p>
</main>

<script src="../../lib/pardalote.js"></script>
<script src="connect.js"></script>
<script src="sketch.js"></script>
</body>
</html>
