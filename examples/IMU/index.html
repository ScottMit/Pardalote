<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion sensor (IMU) — Pardalote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hud">
        <div class="brand"><a href="https://scottmit.github.io/Pardalote/examples/IMU.html">Pardalote</a></div>
        <div class="heading">Motion sensor (IMU)</div>
        <div id="status" class="disconnected">status: waiting for connection…</div>

        <div class="section">
            <div class="label">ORIENTATION</div>
            <div id="angles">
                <span class="axis-x">ROLL</span>  <span id="roll-val" class="angle-val">—</span><span class="deg">°</span>
                <span class="axis-y">PITCH</span> <span id="pitch-val" class="angle-val">—</span><span class="deg">°</span>
                <span class="axis-z">YAW</span>   <span id="yaw-val" class="angle-val">—</span><span class="deg">°</span>
            </div>
        </div>

        <div class="section">
            <div class="label">ACCEL (g)</div>
            <div id="accel">X — &nbsp; Y — &nbsp; Z —</div>
        </div>

        <div class="section">
            <div class="label">GYRO (°/s)</div>
            <div id="gyro">X — &nbsp; Y — &nbsp; Z —</div>
        </div>

        <div class="section">
            <div id="temp">TEMP —</div>
        </div>

        <button id="cal-btn" onclick="doCalibrate()">CALIBRATE &nbsp;[C]</button>
        <div id="cal-msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <script src="../../pardalote-js/pardalote.js"></script>
    <script src="../../pardalote-js/imu.js"></script>
    <!-- <script src="3DBenchy.stl"></script> -->
    <script src="sketch.js"></script>
</body>
</html>
