<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared potentiometer — Pardalote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="top">
            <div class="brand"><a href="https://scottmit.github.io/Pardalote/examples/shared-potentiometer.html">Pardalote</a></div>
            <div class="heading">Shared potentiometer</div>
            <div id="status">Upload the shared-potentiometer example, then connect below (WiFi IP or USB) — the Arduino announces the input itself.</div>
        </div>

        <div class="row">
            <span class="lbl">Board</span>
            <select id="transport"><option>WiFi</option><option>USB</option></select>
            <input id="ip" type="text" style="width:130px">
            <button id="connect" class="primary">Connect</button>
            <button id="disconnect">Disconnect</button>
        </div>

        <div id="value">—</div>

        <div class="bar-track">
            <div id="bar"></div>
        </div>

        <p class="hint">
            Turn the potentiometer.
            The Arduino told the browser to poll this pin —
            no <code>pinMode</code> or <code>analogRead</code> in the JS.
        </p>
    </main>

    <!-- Named pins (A0, D13, SDA, …) resolve automatically for the connected
         board; this sketch uses the string form 'A0'. See the Pins reference. -->
    <script src="../../lib/pardalote.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
