<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared light switch — Pardalote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="top">
            <div class="heading">Shared light switch</div>
            <div id="status">set ARDUINO_IP in sketch.js — one light, four switches</div>
        </div>

        <div id="light" class="off">OFF</div>

        <div class="buttons">
            <button id="on-btn">ON</button>
            <button id="off-btn">OFF</button>
        </div>

        <p class="hint">
            Press the physical buttons on the Arduino, or click here.
            Either side flips the light, both views stay in sync.
        </p>
    </main>

    <script src="../../pardalote-js/pardalote.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
